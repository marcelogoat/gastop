<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de dados — Gás Silva</title>
<link rel="icon" type="image/webp" href="admin/uploads/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;background:#F7F8FA;font-family:'DM Sans',sans-serif;color:#111827}
.top{background:#fff;border-bottom:1px solid #E8E9EC;padding:12px 16px}
.top-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top img{width:36px;height:36px;border-radius:10px;object-fit:cover}
.top b{display:block;font-size:15px}
.top span{display:block;font-size:11px;color:#6B7280;font-weight:500}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:#fff;border:1px solid #E8E9EC;border-radius:18px;padding:20px}
h1{font-size:22px;letter-spacing:-.4px;margin-bottom:6px}
.lead{font-size:14px;color:#6B7280;margin-bottom:16px;line-height:1.45}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #F2F3F5}
.row:last-of-type{border-bottom:none}
.lbl{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#9FA3AD}
.val{font-size:16px;font-weight:700;letter-spacing:-.2px;word-break:break-all}
.copy{border:none;background:#F2F3F5;color:#111827;border-radius:10px;padding:8px 10px;font:700 12px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.copy:hover{background:#E8E9EC}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:none;border-radius:14px;padding:14px;font:700 15px 'DM Sans',sans-serif;cursor:pointer;min-height:50px}
.btn-main{background:#00C566;color:#fff}
.btn-ghost{background:#fff;color:#6B7280;border:1.5px solid #E8E9EC;text-decoration:none;display:flex;align-items:center;justify-content:center}
.note{margin-top:14px;font-size:12px;color:#6B7280;line-height:1.45}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <img src="admin/uploads/logo.webp" alt="">
    <div><b>Gerador de dados</b><span>Nome, CPF, e-mail e celular</span></div>
  </div>
</header>
<main class="wrap">
  <section class="card">
    <h1>Dados pessoais</h1>
    <p class="lead">Gera nome, CPF válido, e-mail e celular para preencher o checkout.</p>
    <div class="row"><div style="flex:1;min-width:0"><div class="lbl">Nome</div><div class="val" id="g-nome">—</div></div><button class="copy" type="button" onclick="copiar('g-nome')">Copiar</button></div>
    <div class="row"><div style="flex:1;min-width:0"><div class="lbl">CPF</div><div class="val" id="g-cpf">—</div></div><button class="copy" type="button" onclick="copiar('g-cpf')">Copiar</button></div>
    <div class="row"><div style="flex:1;min-width:0"><div class="lbl">E-mail</div><div class="val" id="g-email">—</div></div><button class="copy" type="button" onclick="copiar('g-email')">Copiar</button></div>
    <div class="row"><div style="flex:1;min-width:0"><div class="lbl">Celular</div><div class="val" id="g-fone">—</div></div><button class="copy" type="button" onclick="copiar('g-fone')">Copiar</button></div>
    <div class="actions">
      <button class="btn btn-main" type="button" onclick="gerar()">Gerar novos dados</button>
      <button class="btn btn-ghost" type="button" onclick="usarCheckout()">Usar no checkout</button>
    </div>
    <a class="btn btn-ghost" href="checkout.html" style="margin-top:10px">Abrir checkout</a>
    <p class="note">CPF com dígitos verificadores válidos. E-mail e nome são fictícios, só para teste local.</p>
  </section>
</main>
<script src="dados-fake.js"></script>
<script>
var atual=null;
function mostrar(p){
  atual=p;
  document.getElementById('g-nome').textContent=p.nome;
  document.getElementById('g-cpf').textContent=p.cpf;
  document.getElementById('g-email').textContent=p.email;
  document.getElementById('g-fone').textContent=p.fone;
}
function gerar(){ mostrar(gerarPessoa()); }
function copiar(id){
  var t=document.getElementById(id).textContent;
  if(!t||t==='—') return;
  if(navigator.clipboard) navigator.clipboard.writeText(t);
}
function usarCheckout(){
  if(!atual) gerar();
  try{
    var d=JSON.parse(sessionStorage.getItem('ck_form')||'{}')||{};
    d.nome=atual.nome; d.cpf=atual.cpf; d.email=atual.email; d.fone=atual.fone;
    sessionStorage.setItem('ck_form', JSON.stringify(d));
  }catch(e){}
  location.href='checkout.html';
}
gerar();
</script>
</body>
</html>
